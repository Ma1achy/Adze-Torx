[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adze-t"
version = "0.0.0"
description = "Torx-native stochastic draft-and-refine language model research scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adze-T contributors" }]
dependencies = [
    "jax>=0.4.31",
    "equinox>=0.13.0",
    "optax>=0.2.3",
]

[project.optional-dependencies]
torx = [
    "extro-torx @ git+https://github.com/extropic-ai/torx.git@f1fc858ed950ecd41935d15c06d0ec7c5e0674ae",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adze_t"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: higher-sample statistical conformance tests",
    "contract: dependency/interface contract tests",
    "oracle: exact or analytic oracle tests",
    "integration: Torx integration tests",
    "statistical: statistical estimator tests",
    "metamorphic: equivalence/property tests",
    "e2e: end-to-end training/model tests",
]
