[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adze-t"
version = "0.0.0"
description = "Faithful Adze deterministic/Torx architecture implementation"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.4.30",
  "jaxtyping>=0.2.34",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "extro-torx @ git+https://github.com/extropic-ai/torx.git@f1fc858ed950ecd41935d15c06d0ec7c5e0674ae",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adze_t"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
exclude = ["experiments"]
